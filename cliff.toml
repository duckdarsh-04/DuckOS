[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for commit in commits %}
### {{ commit.committer.timestamp | date(format="%Y-%m-%d") }}
{{ commit.message | trim }}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
sort_commits = "newest"
commit_parsers = [
  { message = ".*", group = "Changes" },
]
